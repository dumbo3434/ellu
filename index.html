<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sulle 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Fredoka',sans-serif;background:linear-gradient(160deg,#ffe3ec,#ffd1dc 50%,#ffc2d4);color:#7a2944;display:flex;align-items:center;justify-content:center;user-select:none}
  .floaty{position:fixed;bottom:-40px;pointer-events:none;animation:up linear forwards;opacity:.8}
  @keyframes up{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
  .scene{position:relative;width:min(92vw,380px);text-align:center;z-index:2}
  .hide{display:none!important}

  /* envelope */
  .env-wrap{cursor:pointer;animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-8px)}}
  .env{position:relative;width:240px;height:160px;margin:0 auto;background:#ff8fab;border-radius:10px;box-shadow:0 12px 30px rgba(180,40,90,.25)}
  .env:before{content:"";position:absolute;inset:0;border-radius:10px;background:linear-gradient(to top right,transparent 49.5%,#ff7096 50%) left/50% 100% no-repeat,linear-gradient(to top left,transparent 49.5%,#ff7096 50%) right/50% 100% no-repeat}
  .flap{position:absolute;top:0;left:0;width:0;height:0;border-left:120px solid transparent;border-right:120px solid transparent;border-top:90px solid #ff5c8a;transform-origin:top;transition:transform .5s;z-index:3}
  .seal{position:absolute;left:50%;top:70px;transform:translateX(-50%);font-size:34px;z-index:4;transition:opacity .3s}
  .env-wrap.open .flap{transform:rotateX(180deg)}
  .env-wrap.open .seal{opacity:0}
  .hint{margin-top:22px;font-size:18px;opacity:.85}

  /* card */
  .card{background:#fff;border-radius:22px;padding:30px 22px 26px;box-shadow:0 14px 40px rgba(180,40,90,.22);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{from{transform:scale(.6);opacity:0}}
  .big{font-size:64px;line-height:1;animation:beat 1.1s infinite}
  @keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
  h1{font-family:'Caveat',cursive;font-size:40px;margin:14px 0 6px;color:#e0436f}
  p{font-size:17px;line-height:1.45;margin-bottom:6px}
  .btns{position:relative;height:70px;margin-top:22px}
  button{font-family:inherit;font-size:19px;font-weight:600;border:none;border-radius:999px;padding:12px 28px;cursor:pointer;transition:transform .15s}
  .yes{background:#ff4d7d;color:#fff;box-shadow:0 6px 16px rgba(255,77,125,.4)}
  .yes:active{transform:scale(.94)}
  .no{background:#f3e3e8;color:#a55;position:absolute;transition:left .25s,top .25s}
  .msg{min-height:22px;font-size:15px;opacity:.75;margin-top:6px}
  .final .big{font-size:80px}
</style>
</head>
<body>

<div class="scene">
  <!-- 1: envelope -->
  <div id="s1">
    <div class="env-wrap" id="env">
      <div class="env"><div class="flap"></div><div class="seal">💗</div></div>
    </div>
    <div class="hint">sulle tuli postia ✨<br><small>(napauta)</small></div>
  </div>

  <!-- 2: question -->
  <div id="s2" class="hide">
    <div class="card">
      <div class="big">🥺</div>
      <h1>Moikka Ellu</h1>
      <p><b>Osaatko shufflee? 🕺</b></p>
      <div class="btns" id="btns">
        <button class="yes" id="yes" style="position:absolute;left:12%;top:10px">Joo 💖</button>
        <button class="no" id="no" style="left:58%;top:10px">Ei</button>
      </div>
      <div class="msg" id="msg"></div>
    </div>
  </div>

  <!-- 3: yay -->
  <div id="s3" class="hide">
    <div class="card final">
      <div class="big">🥰</div>
      <h1>Tiesin sen!</h1>
      <p>Ens kerralla ku nähää haluun nähä 💃</p>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const emojis = ['💗','💕','💖','🌸','✨','💘','🫶'];

function floaty(n=1, fast=false){
  for(let i=0;i<n;i++){
    const e=document.createElement('div');
    e.className='floaty';
    e.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    e.style.left=Math.random()*100+'vw';
    e.style.fontSize=(16+Math.random()*24)+'px';
    e.style.animationDuration=(fast?2+Math.random()*2:6+Math.random()*5)+'s';
    document.body.appendChild(e);
    setTimeout(()=>e.remove(),12000);
  }
}
setInterval(()=>floaty(1),700);

$('env').addEventListener('click',()=>{
  $('env').classList.add('open');
  floaty(12,true);
  setTimeout(()=>{$('s1').classList.add('hide');$('s2').classList.remove('hide');},700);
});

const lines=['ei käy 🙅','yritä uudestaan','väärä nappi 😤','nope','etkö oo varma?','mä en hyväksy tätä','haha ei','napin täytyy olla rikki'];
let tries=0, yesScale=1;
function dodge(e){
  if(e) e.preventDefault();
  const box=$('btns').getBoundingClientRect(), no=$('no');
  const card=document.querySelector('#s2 .card').getBoundingClientRect();
  // jump anywhere inside the card
  const maxX=card.width-no.offsetWidth-20, maxY=card.height-no.offsetHeight-20;
  const x=10+Math.random()*maxX - (box.left-card.left);
  const y=10+Math.random()*maxY - (box.top-card.top);
  no.style.left=x+'px'; no.style.top=y+'px';
  $('msg').textContent=lines[tries++%lines.length];
  yesScale=Math.min(yesScale+0.12,1.9);
  $('yes').style.transform='scale('+yesScale+')';
}
$('no').addEventListener('mouseenter',dodge);
$('no').addEventListener('touchstart',dodge,{passive:false});
$('no').addEventListener('click',dodge);

$('yes').addEventListener('click',()=>{
  $('s2').classList.add('hide');$('s3').classList.remove('hide');
  floaty(40,true);
  setInterval(()=>floaty(3,true),400);
});
</script>
</body>
</html>
